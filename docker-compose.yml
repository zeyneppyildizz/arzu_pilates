version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: arzu_pilates_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456   
      POSTGRES_DB: ArzuPilatesDb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: